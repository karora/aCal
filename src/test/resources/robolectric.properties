# Settings for every Robolectric test.
#
# The Android version to imitate.  Named so that tests do not change behaviour
# when targetSdk does; raise it when Robolectric supports the new version.
sdk=36
# A bare Application instead of AcalApplication, which opens the database as it
# starts.  The database needs the native SQLCipher library, and that only
# exists for devices: tests that need it are instrumented tests.
application=android.app.Application
