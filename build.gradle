buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = 'org.davical.acal'
    compileSdk 37
    buildToolsVersion '37.0.0'

    useLibrary 'org.apache.http.legacy'

    buildFeatures {
        aidl = true
    }

    defaultConfig {
        applicationId "org.davical.acal"
        minSdkVersion 24
        targetSdkVersion 36

	// Remember to also update src/main/res/raw/upgrade_notes.txt
        versionCode 71
        versionName "1.71"

        testInstrumentationRunner 'org.davical.acal.AcalTestRunner'
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        // Each instrumented test gets a process of its own: the database is
        // prepared once per process, and the managers are singletons.
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
        managedDevices {
            localDevices {
                // Run with ./build-in-container.sh emulatorDebugAndroidTest.
                // Keep the system image in step with the Dockerfile.
                emulator {
                    device = 'Pixel 6'
                    apiLevel = 36
                    systemImageSource = 'aosp-atd'
                    testedAbi = 'x86_64'
                }
            }
        }
        unitTests {
            // Robolectric tests need the app's resources and manifest
            includeAndroidResources = true
            all {
                // Robolectric reaches into the JDK to stand in for Android 16
                jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'
            }
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    // Take care with major SQLCipher upgrades: if a new version cannot open
    // existing databases with its default settings, AcalDBHelper will treat
    // them as unreadable and replace them with empty ones.
    implementation 'net.zetetic:sqlcipher-android:4.19.1'
    implementation 'androidx.sqlite:sqlite:2.7.1'
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.14.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core:1.7.0'
    // On a device org.apache.http comes from the platform's legacy library; the copy
    // the SDK gives us to compile against only throws.  This is the real thing.
    testImplementation 'org.apache.httpcomponents:httpcore:4.4.16'
    // Keep in step with okhttp above
    testImplementation 'com.squareup.okhttp3:mockwebserver3:5.5.1'
    testImplementation 'com.squareup.okhttp3:okhttp-tls:5.5.1'

    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    // Keep in step with okhttp above
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver3:5.5.1'
    androidTestImplementation 'com.squareup.okhttp3:okhttp-tls:5.5.1'
    androidTestUtil 'androidx.test:orchestrator:1.6.1'
}
